<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaos Garden — CG</title>
  <link rel="stylesheet" href="./style.css" />
  <script>
    // The import map must exist before the first module script executes (§7.3).
    // A committed vendor copy of three.js is selected when running from file://.
    (function () {
      var local = location.protocol === 'file:';
      var base = local ? './vendor/three@0.169.0/' : 'https://unpkg.com/three@0.169.0/';
      var map = { imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } };
      document.write('<script type="importmap">' + JSON.stringify(map) + '<\/script>');
    })();
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="app">
    <header id="toolbar" aria-label="Modes and transport"></header>
    <aside id="tools" aria-label="Paint tools"></aside>
    <div class="gutter" data-var="tools-w" data-dir="left" data-min="160" data-max="480" data-default="220" role="separator" aria-orientation="vertical" title="drag to resize · double-click to reset"></div>
    <main id="stage">
      <canvas id="gl" aria-label="Plan view of the channel" tabindex="0"></canvas>
      <div id="hud"></div>
    </main>
    <div class="gutter" data-var="side-w" data-dir="right" data-min="240" data-max="720" data-default="360" role="separator" aria-orientation="vertical" title="drag to resize · double-click to reset"></div>
    <aside id="side" aria-label="Measurements"></aside>
  </div>
  <div id="notify" role="status" aria-live="polite"></div>
  <noscript>Chaos Garden needs JavaScript and WebGL2.</noscript>
</body>
</html>
